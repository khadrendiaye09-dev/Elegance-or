<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | ÉLÉGANCE D'OR</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="page-contact">

    <main class="contact-container">

        <form class="formulaire-contact">

            <a href="index.html" class="logo">
                ÉLÉGANCE <span>D'OR</span>
            </a>

            <h1>Contactez-nous</h1>
            <p>Notre équipe est à votre écoute.</p>

            <label for="nom-contact">Nom</label>
            <input type="text" id="nom-contact" name="nom"
                   placeholder="Votre nom" required>

            <label for="email-contact">Adresse e-mail</label>
            <input type="email" id="email-contact" name="email"
                   placeholder="Votre adresse e-mail" required>

            <label for="message">Votre message</label>
            <textarea id="message" name="message"
                      placeholder="Écrivez votre message..."
                      rows="5" required></textarea>

            <button type="submit">Envoyer le message</button>

            <a href="index.html" class="retour-accueil">
                Retour à l'accueil
            </a>

        </form>

    </main>

</body>
</html>
