
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription | ÉLÉGANCE D'OR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-inscription">

    <main class="inscription-container">

        <form class="formulaire-inscription">
            <a href="index.html" class="logo">
                ÉLÉGANCE <span>D'OR</span>
            </a>

            <h1>Créer un compte</h1>
            <p>Bienvenue dans l'univers ÉLÉGANCE D'OR.</p>

            <label for="nom">Nom</label>
            <input type="text" id="nom" name="nom"
                   placeholder="Votre nom" required>

            <label for="prenom">Prénom</label>
            <input type="text" id="prenom" name="prenom"
                   placeholder="Votre prénom" required>

            <label for="email">Adresse e-mail</label>
            <input type="email" id="email" name="email"
                   placeholder="exemple@email.com" required>

            <label for="motdepasse">Mot de passe</label>
            <input type="password" id="motdepasse"
                   name="motdepasse" placeholder="Mot de passe"
                   required minlength="8">

            <button type="submit">Créer mon compte</button>

            <a href="index.html" class="retour-accueil">
                Retour à l'accueil
            </a>
        </form>

    </main>

</body>
</html>
